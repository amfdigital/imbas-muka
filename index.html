<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Imbasan Muka & Google Sheets</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- face-api.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 text-center">
        <h1 class="text-xl font-bold mb-2">Sistem Kehadiran Muka</h1>
        <p id="status-text" class="text-yellow-400 text-sm mb-4">Memuatkan model AI...</p>

        <!-- Paparan Kamera -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden shadow-inner flex items-center justify-center">
            <video id="video" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover"></video>
            <canvas id="overlay" class="absolute inset-0 w-full h-full"></canvas>
        </div>

        <!-- Maklumat Hasil Imbasan -->
        <div id="result-box" class="mt-4 p-3 bg-gray-700 rounded-lg text-sm hidden">
            <span class="text-gray-300">Dikesan: </span>
            <span id="detected-name" class="font-bold text-green-400"></span>
            <p id="send-status" class="text-xs text-gray-400 mt-1"></p>
        </div>
    </div>

    <script>
        // PASTIKAN ANDA MASUKKAN PAUTAN WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz3NwSfLl_H1NTZ24V1Cy5heItF_L7ZlmmG2HDF1pnR3L2DYjVLNjn-VsVWQDej-cEUsg/exec";

        const video = document.getElementById('video');
        const statusText = document.getElementById('status-text');
        const resultBox = document.getElementById('result-box');
        const detectedName = document.getElementById('detected-name');
        const sendStatus = document.getElementById('send-status');

        let modelsLoaded = false;
        let isSending = false;

        async function loadModels() {
            try {
                statusText.innerText = "Memuatkan fail model AI...";
                // Menggunakan pautan jsDelivr yang lebih stabil untuk weights/models
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkTinyNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                modelsLoaded = true;
                statusText.innerText = "Sila halakan kamera ke muka.";
                startCamera();
            } catch (error) {
                statusText.innerText = "Gagal memuatkan model. Semak internet/rangkaian.";
                console.error(error);
            }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, 
                audio: false 
            })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                statusText.innerText = "Kamera tidak dibenarkan atau tidak ditemui.";
                console.error(err);
            });
        }

        video.addEventListener('play', () => {
            const canvas = document.getElementById('overlay');
            const displaySize = { width: video.videoWidth || 360, height: video.videoHeight || 480 };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (!modelsLoaded || isSending) return;

                const detections = await faceapi.detectSingleFace(
                    video, 
                    new faceapi.TinyFaceDetectorOptions()
                ).withFaceLandmarks().withFaceDescriptor();

                if (detections) {
                    statusText.innerText = "Wajah dikesan!";
                    statusText.className = "text-green-400 text-sm mb-4";
                    
                    resultBox.classList.remove('hidden');
                    let namaIndividu = "Ahmad Mubarak"; // Nama sementara
                    detectedName.innerText = namaIndividu;

                    // Hantar data ke Google Sheets
                    hantarKeGoogleSheets(namaIndividu);

                } else {
                    statusText.innerText = "Mencari wajah...";
                    statusText.className = "text-yellow-400 text-sm mb-4";
                }
            }, 1000);
        });

        async function hantarKeGoogleSheets(nama) {
            if (GAS_URL.includes("PAUTAN_WEB_APP")) {
                sendStatus.innerText = "Amaran: Sila masukkan pautan GAS URL dalam kod!";
                return;
            }

            isSending = true;
            sendStatus.innerText = "Menghantar rekod ke Google Sheets...";

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama: nama, status: "Hadir" })
                });

                sendStatus.innerText = "Berjaya direkodkan ke Google Sheets! ✅";
                
                setTimeout(() => {
                    isSending = false;
                    sendStatus.innerText = "";
                }, 10000);

            } catch (error) {
                console.error(error);
                sendStatus.innerText = "Gagal menghantar rekod. ❌";
                isSending = false;
            }
        }

        loadModels();
    </script>
</body>
</html>
