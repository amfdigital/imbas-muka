<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Imbasan Muka</title>
    <!-- Tailwind CSS untuk rekaan antara muka -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- face-api.js untuk pengecaman muka -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-min min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 text-center">
        <h1 class="text-xl font-bold mb-2">Sistem Kehadiran Muka</h1>
        <p id="status-text" class="text-yellow-400 text-sm mb-4">Memuatkan model AI...</p>

        <!-- Paparan Kamera -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden shadow-inner flex items-center justify-center">
            <video id="video" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover"></video>
            <canvas id="overlay" class="absolute inset-0 w-full h-full"></canvas>
        </div>

        <!-- Maklumat Hasil Imbasan -->
        <div id="result-box" class="mt-4 p-3 bg-gray-700 rounded-lg text-sm hidden">
            <span class="text-gray-300">Status: </span>
            <span id="detected-name" class="font-bold text-green-400"></span>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status-text');
        const resultBox = document.getElementById('result-box');
        const detectedName = document.getElementById('detected-name');

        let modelsLoaded = false;

        async function loadModels() {
            try {
                statusText.innerText = "Memuatkan fail model AI...";
                const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkTinyNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                modelsLoaded = true;
                statusText.innerText = "Sila halakan kamera ke muka anda.";
                startCamera();
            } catch (error) {
                statusText.innerText = "Gagal memuatkan model. Semak sambungan internet.";
                console.error(error);
            }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, // Menggunakan kamera hadapan telefon
                audio: false 
            })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                statusText.innerText = "Kamera tidak dibenarkan atau tidak ditemui.";
                console.error(err);
            });
        }

        video.addEventListener('play', () => {
            const canvas = document.getElementById('overlay');
            const displaySize = { width: video.videoWidth || 360, height: video.videoHeight || 480 };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (!modelsLoaded) return;

                const detections = await faceapi.detectSingleFace(
                    video, 
                    new faceapi.TinyFaceDetectorOptions()
                ).withFaceLandmarks().withFaceDescriptor();

                const context = canvas.getContext('2d');
                context.clearRect(0, 0, canvas.width, canvas.height);

                if (detections) {
                    statusText.innerText = "Muka dikesan!";
                    statusText.className = "text-green-400 text-sm mb-4";
                    
                    resultBox.classList.remove('hidden');
                    detectedName.innerText = "Indeks Muka Aktif (Belum didaftarkan nama)";
                    
                    // Di sini nanti kita boleh tambah fungsi hantar ke Google Sheets
                } else {
                    statusText.innerText = "Mencari wajah...";
                    statusText.className = "text-yellow-400 text-sm mb-4";
                    resultBox.classList.add('hidden');
                }
            }, 500);
        });

        // Mulakan proses
        loadModels();
    </script>
</body>
</html>
